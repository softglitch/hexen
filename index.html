<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>

    <div id="uploadScreen">
        <div id="dropZone">
            <div id="dropIcon">&#128247;</div>
            <p id="dropText">Drop an image here</p>
            <p id="dropSubtext">JPEG or PNG</p>
            <label id="uploadBtn" for="fileInput">Browse files</label>
            <input type="file" id="fileInput" accept="image/jpeg,image/png">
        </div>
    </div>

    <div id="mainLayout">
        <div id="editorPanel">
            <div id="structureMap"></div>
            <div id="glitchTools">
                <select id="glitchOp">
                    <option value="xor">XOR</option>
                    <option value="add">ADD</option>
                    <option value="sub">SUB</option>
                    <option value="set">SET</option>
                    <option value="null">NULL</option>
                    <option value="reverse">Reverse</option>
                    <option value="sort">Sort</option>
                    <option value="shuffle">Shuffle</option>
                </select>
                <span id="glitchValueGroup">value <input id="glitchValue" type="text" placeholder="01" maxlength="2" value="01"></span>
                <span id="glitchStrideGroup">every <input id="glitchStride" type="number" value="16" min="1"> bytes</span>
                <span>in</span>
                <select id="glitchRange"></select>
                <button id="glitchApply">Apply</button>
                <button id="glitchUndo" disabled>Undo</button>
            </div>
            <div class="editor-section">
                <div id="editor" contenteditable="true" spellcheck="false"></div>
            </div>
        </div>
        <div id="previewPanel">
            <img id="output">
            <p id="errorMessage">Invalid hex string</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
